<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/shop.css">
    <link rel="stylesheet" href="CSS/cart.css">
    <link rel="stylesheet" href="CSS/checkout.css">
    <link rel="stylesheet" href="CSS/blog.css">
    <link rel="stylesheet" href="CSS/shopping-cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
   <link rel="shortcut icon" href="Images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
   <title>Blog-Furniture E-Commerce</title>
</head>
<body>
<section class="section-cart-sidebar">
<div class="cart-sidebar">
    <div class="cart-header">
        <h2>Shopping Cart</h2>
        <span class="fa-stack fa-1x">
  <i class="fas fa-shopping-bag fa-stack-1x"></i>
  <i class="fas fa-times fa-stack-1x c" style="color: grey;"></i>
</span>
    </div>
    <hr class="line">
    <div class="cart-item">
        <img src="Images/2ac413c1917ac944454e358f73d0af67e1f1b74e (1).png" alt="Product-Images">
        <div class="item-info">
            <h4>Asgaard sofa</h4>
            <p>1 × <span>250,000.00</span></p>
        </div>
        <div class="remove">✕</div>
    </div>
    <div class="cart-item">
        <img src="Images/76149a1a1d489ea6ae7783215d8976dab5c582e3.jpg" alt="Product-Images">
        <div class="item-info">
            <h4>Casaliving Wood</h4>
            <p>1 × <span>270,000.00</span></p>
        </div>
        <div class="remove">✕</div>
    </div>
    <div class="subtotal">
        <span>Subtotal</span>
        <span class="price">520,000.00</span>
    </div>
    <div class="bottom-buttons">
        <button>Cart</button>
        <button>Checkout</button>
        <button>Comparison</button>
    </div>
</div>
</section>
</body>
</html>
