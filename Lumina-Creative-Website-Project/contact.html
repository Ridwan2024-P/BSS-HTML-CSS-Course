<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="Images/favicon.ico">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Contact Lumina Creative</title>
</head>
<body>
   <header class="header">
    <div class="container container-sm header-flex">
        <img src="Images/logo.png" alt="Lumina Creative" class="logo">
        <ul class="main-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a class="current" href="contact.html">Contact</a></li>
        </ul>
    </div>
   </header>
    
   <section class="hero bg-dark">
    <div class="container conatiner-sm">
        <h2><span class="bg-primary">Inspired</span> minds, shaping exceptional projects fueled by<span class="bg-primary">ingenuity</span></h2>
    </div>
   </section>  

   <section class="contact">
    <div class="container container-sm">
        <h2 class="section-heading">Contact Us</h2>
        <p>Have a question? Leave your information below and we will get back to you as soon as possible</p>
        <form name="contact" netlify>
            <div class="form-group">
                <label for="first-name" class="visually-hidden">First Name</label>
                <input type="text" name="first-name" id="first-name" placeholder="First Name">
            </div>
            <div class="form-group">
                <label for="last-name" class="visually-hidden">Last Name</label>
                <input type="text" name="last-name" id="last-name" placeholder="Last Name">
            </div>
             <div class="form-group">
                <label for="email" class="visually-hidden">Email Address</label>
                <input type="email" name="email" id="email" placeholder="Email Address">
            </div>
            <div class="form-group">
                <label for="message" class="visually-hidden">Message</label>
                <textarea  name="message" id="message" placeholder="Message"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Sent Message</button>
            </div>
        </form>
   </section>
   
  

   <footer class="footer">
        <div class="container footer-flex">
            <img src="Images/logo.png" alt="Lumina Creative">
            <div>
                <h4>Contact Us</h4>
                <ul>
                    <li>(555) 555-5555</li>
                    <li>contact@lumina.test</li>
                    <li>10 Main st Boston Ma</li>
                </ul>
            </div>
            <div>
                <h4>Follow Us</h4>
                <a href="#"><i class="fab fa-facebook fa-2x"></i>
                <a href="#"><i class="fab fa-twitter fa-2x"></i>
                <a href="#"><i class="fab fa-instagram fa-2x"></i>
                <a href="#"><i class="fab fa-pinterest fa-2x"></i>
                <a href="#"><i class="fab fa-tumblr fa-2x"></i>      
            </div>
        </div>
   </footer>
</body>
</html>
